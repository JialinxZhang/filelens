<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileLens · 文件夹速览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234c6ef5'/%3E%3Cpath d='M10 10h4M10 16h12M10 22h8M10 10v12' stroke='white' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#4c6ef5"/><path d="M10 10h4M10 16h12M10 22h8M10 10v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    <span class="brand-name">FileLens</span><span class="brand-sub">文件夹速览</span>
  </div>
  <div class="root-chip" id="rootChip" title="点击更换文件夹">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.2a1.5 1.5 0 0 1 1 .4L8.4 3.5H13A1.5 1.5 0 0 1 14.5 5v7A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12z"/></svg>
    <span id="rootChipText">未加载文件夹</span>
  </div>
  <div class="top-stats" id="topStats"></div>
  <div class="search">
    <svg class="search-ic" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="m10.6 10.6 3 3" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="搜索文件 / 文件夹，按 / 聚焦" autocomplete="off">
    <div class="match-chip" id="matchChip" hidden></div>
  </div>
</header>

<main>
  <section id="canvas">
    <div class="overlay overlay-tl" id="breadcrumb" hidden title="按住空白处拖动可移动 · 双击复位"></div>
    <div class="overlay overlay-tr" id="toolbar" hidden title="按住空白处拖动可移动 · 双击复位">
      <button class="tool" id="zoomOut" title="缩小">−</button>
      <span class="zoom-pct" id="zoomPct">100%</span>
      <button class="tool" id="zoomIn" title="放大">＋</button>
      <span class="vsep"></span>
      <button class="tool wide" id="fitBtn" title="适配视图">适配</button>
      <span class="vsep"></span>
      <span class="depth-label">展开</span>
      <button class="tool seg" data-depth="1" title="展开到第 1 层">1</button>
      <button class="tool seg" data-depth="2" title="展开到第 2 层">2</button>
      <button class="tool seg" data-depth="3" title="展开到第 3 层">3</button>
      <button class="tool seg" data-depth="all" title="展开全部层级">全部</button>
      <button class="tool seg" data-depth="0" title="全部收起，只看第一层">收起</button>
    </div>
    <div class="hint-pill" id="hintPill" hidden title="按住空白处拖动可移动 · 双击复位">单击详情 · 双击展开 · 拖拽平移 · 滚轮缩放 · <kbd>/</kbd> 搜索 · 浮条可拖动</div>
    <svg id="tree"><g id="world"></g></svg>

    <div class="welcome" id="welcome" hidden>
      <div class="wcard">
        <svg width="52" height="52" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#4c6ef5"/><path d="M10 10h4M10 16h12M10 22h8M10 10v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
        <h1>FileLens · 文件夹速览</h1>
        <p>把一个又深又乱的文件夹，变成一张可以探索的地图：<br>树状结构、文件摘要、内容预览，一目了然。</p>
        <div class="wrow">
          <input id="welcomePath" type="text" placeholder="粘贴文件夹的完整路径，例如 C:\Users\you\某项目材料">
          <button class="btn" id="welcomeBrowse">浏览…</button>
          <button class="btn-primary" id="welcomeGo">开始探索</button>
        </div>
        <div class="wnote" id="welcomeNote"></div>
      </div>
    </div>

    <div class="loading" id="loading" hidden>
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">正在扫描文件夹…</div>
    </div>
  </section>

  <div class="vsplit" id="vsplit" title="按住左右拖动，调整详情面板宽度"></div>
  <aside id="details">
    <div class="d-empty">
      <svg width="40" height="40" viewBox="0 0 32 32" fill="none" stroke="#c6cbd3" stroke-width="1.6"><path d="M4 10V6.5A1.5 1.5 0 0 1 5.5 5h5l2 2h9A1.5 1.5 0 0 1 23 8.5V12M4 10l1.8 15h19.4L27 12H4z" stroke-linejoin="round"/></svg>
      <p>点击树中的任意文件或文件夹<br>这里会显示它的摘要和核心内容</p>
    </div>
  </aside>
</main>

<div class="pop" id="rootPop" hidden>
  <div class="pop-title">更换文件夹</div>
  <div class="wrow">
    <input id="popPath" type="text" placeholder="粘贴新的文件夹路径">
    <button class="btn" id="popBrowse">浏览…</button>
    <button class="btn-primary" id="popGo">载入</button>
  </div>
  <div class="pop-roots" id="popRoots"></div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
